name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify dependency manifest
        run: npm ls --all
      - name: Build store package
        run: npm run package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabmixer-extension
          path: release/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run package
      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
