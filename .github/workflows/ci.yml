name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: tabmixer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source
        run: npm run check
      - name: Prepare dependency lockfile for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify dependency manifest
        run: npm ls --all
      - name: Build store package
        run: npm run package
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabmixer-extension
          path: release/*.zip
          if-no-files-found: error
  browser-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run extension popup smoke test
        run: npx playwright test e2e/popup.spec.js --reporter=line

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run package
      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
